<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Linear Search</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 5px 20px
                rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 8px;

            font-weight: bold;

            color: #444;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #007bff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;

            padding: 15px;

            text-align: center;

            border-radius: 6px;

            font-size: 18px;

            font-weight: bold;

            background: #eee;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Linear Search</h1>

        <form method="POST">

            <label>Enter Array</label>

            <input
                type="text"
                name="array"
                value="10,20,30,40,50,60,70,80"
                placeholder="10,20,30,40"
                required
            >

            <label>Enter Target</label>

            <input
                type="number"
                name="target"
                placeholder="Enter target"
                required
            >

            <button type="submit">
                Search
            </button>

        </form>

        {% if result %}

            <div class="result">
                {{ result }}
            </div>

        {% endif %}

    </div>

</body>
</html>
