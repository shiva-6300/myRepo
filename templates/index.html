<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Linear Search</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;

            background: rgba(255, 255, 255, 0.95);

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(10px);

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 40px;

            align-items: center;
        }

        /* Left Section */

        .form-section {
            width: 100%;
        }

        h1 {
            text-align: center;

            font-size: 32px;

            margin-bottom: 30px;

            color: #222;

            font-weight: 700;
        }

        h1::after {
            content: "";

            display: block;

            width: 60px;

            height: 4px;

            margin: 10px auto 0;

            background: linear-gradient(
                90deg,
                #667eea,
                #764ba2
            );

            border-radius: 10px;
        }

        label {
            display: block;

            margin-top: 20px;

            margin-bottom: 8px;

            font-size: 15px;

            font-weight: 600;

            color: #444;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            border: 2px solid #e1e5eb;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            background: #f8f9fc;

            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #667eea;

            background: white;

            box-shadow:
                0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 100%;

            margin-top: 30px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }


        /* Right Section */

        .result-section {
            width: 100%;

            min-height: 250px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 15px;

            background: #f8f9fc;

            border: 2px dashed #d9dce5;

            padding: 25px;
        }

        .result {
            width: 100%;

            padding: 25px;

            text-align: center;

            border-radius: 12px;

            font-size: 20px;

            font-weight: 600;

            color: white;

            background: linear-gradient(
                135deg,
                #11998e,
                #38ef7d
            );

            box-shadow:
                0 8px 20px rgba(17, 153, 142, 0.25);
        }

        .no-result {
            color: #999;

            font-size: 16px;

            text-align: center;
        }


        /* Mobile Responsive */

        @media (max-width: 700px) {

            .container {
                grid-template-columns: 1fr;

                gap: 25px;

                padding: 30px 22px;
            }

            h1 {
                font-size: 27px;
            }

            input {
                font-size: 15px;
            }

            button {
                font-size: 16px;
            }

            .result-section {
                min-height: 150px;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- FORM SECTION -->

        <div class="form-section">

            <h1>Linear Search</h1>

            <form method="POST">

                <label>Enter Array</label>

                <input
                    type="text"
                    name="array"
                    placeholder="Enter Numbers like this format 10,20,30.."
                    required
                >

                <label>Enter Target</label>

                <input
                    type="number"
                    name="target"
                    placeholder="Enter target"
                    required
                >

                <button type="submit">
                    Search
                </button>

            </form>

        </div>


        <!-- RESULT SECTION -->

        <div class="result-section">

            {% if result %}

                <div class="result">
                    {{ result }}
                </div>

            {% else %}

                <div class="no-result">
                    Search result will appear here
                </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
